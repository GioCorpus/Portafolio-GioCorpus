<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // MIT License
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          l.replace(l.pathname + decoded + l.hash)
        }
      }(window.location))
    </script>
  </head>
  <body>
    <p>Redirecting to <a id="redirect-link"></a>...</p>
    <script>
      document.getElementById('redirect-link').href = window.location.href;
      document.getElementById('redirect-link').textContent = window.location.href;
    </script>
  </body>
</html>
